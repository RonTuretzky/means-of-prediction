# Build and test only. Deployment is deliberately disabled for pushes and PRs.
name: CI/CD
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    # Build/test-only reusable workflow: no deployment job exists in this graph.
    uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@f6182e6d5fbc06813a80f40d8432905ece36b40a
    with:
      working-directory: contracts
      foundry-version: v1.5.1
      etherform-ref: f6182e6d5fbc06813a80f40d8432905ece36b40a
      package-manager: none
      # Existing unrelated files are not uniformly formatted; check changed files below.
      check-formatting: false
      # Tests use only Node built-ins available on the Ubuntu runner.

  frontend:
    name: Frontend fees and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Build contract ABIs (no broadcast)
        working-directory: contracts
        run: forge build
      - name: Check changed contract formatting
        working-directory: contracts
        run: forge fmt --check src/market/FPMM.sol src/market/MarketFactory.sol test/MarketTestBase.sol test/ProtocolFees.t.sol script/Deploy.s.sol script/DeployGnosis.s.sol script/DeploySepolia.s.sol
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Test fee parsing and compatibility
        working-directory: app
        run: pnpm test:fees
      - name: Type-check and build frontend
        working-directory: app
        run: pnpm build
      - name: Install Chromium for local-chain browser tests
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Test browser flows on isolated Anvil
        working-directory: app
        run: pnpm e2e
