# Research-branch-only candidate based on bfe4c7c; not a replacement for main.
# Any later merge must preserve main's frontend, fee, build, and browser gates.
# Build and test only. No deployment workflow or repository secret is passed.
# Contract FFI helpers use Node/Python standard libraries, not app/node_modules.
name: CI/CD
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@f6182e6d5fbc06813a80f40d8432905ece36b40a
    with:
      working-directory: contracts
      foundry-version: v1.8.6
      etherform-ref: f6182e6d5fbc06813a80f40d8432905ece36b40a
      package-manager: none
      check-formatting: true
      test-verbosity: vvv
